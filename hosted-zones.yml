AWSTemplateFormatVersion: '2010-09-09'
Description: Sound Space hosted zones

Resources:
  ConsultingHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: soundspaceconsulting.com.au

  CounsellingHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: soundspacecounselling.au

  # Google Workspace MX Records for soundspaceconsulting.com.au
  ConsultingMXRecords:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref ConsultingHostedZone
      Name: soundspaceconsulting.com.au.
      Type: MX
      TTL: 300
      ResourceRecords:
        - '1 ASPMX.L.GOOGLE.COM'
        - '5 ALT1.ASPMX.L.GOOGLE.COM'
        - '5 ALT2.ASPMX.L.GOOGLE.COM'
        - '10 ALT3.ASPMX.L.GOOGLE.COM'
        - '10 ALT4.ASPMX.L.GOOGLE.COM'

  # Verification TXT records (Google & Microsoft)
  ConsultingVerificationTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref ConsultingHostedZone
      Name: soundspaceconsulting.com.au.
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"google-site-verification=9gRJoYFvAirJv9LIdoIcDxFvQ5ywpX0VUI"'
        - '"google-site-verification=9gRjoYFvAirJv9L1doIcDxFvQ5ywpX0VUmFm04id2PE"'
        - '"MS=ms34306402"'

  # Google domain verification CNAME
  ConsultingGoogleVerificationCNAME:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref ConsultingHostedZone
      Name: xtg4saerzunf.soundspaceconsulting.com.au.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - gv-u3zxnuyebvwpki.dv.googlehosted.com

  # Salatino Hosted Zones
  ClubeSalatinoHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: clubesalatino.com.br

  CanilSalatinoHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: canilsalatino.com.br

  SalatinoHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: salatino.com.br

  # Curves Sculpting Hosted Zone
  CurvesSculptingHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: curvessculpting.com.au

  # Cassia Boglio Hosted Zone
  CassiaBoglioHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: cassiaboglio.com

  # Mind Sounds Hosted Zone
  MindSoundsHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: mindsounds.com.au

  # Google Workspace MX Records for mindsounds.com.au
  MindSoundsMXRecords:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MindSoundsHostedZone
      Name: mindsounds.com.au.
      Type: MX
      TTL: 300
      ResourceRecords:
        - '1 ASPMX.L.GOOGLE.COM'
        - '5 ALT1.ASPMX.L.GOOGLE.COM'
        - '5 ALT2.ASPMX.L.GOOGLE.COM'
        - '10 ALT3.ASPMX.L.GOOGLE.COM'
        - '10 ALT4.ASPMX.L.GOOGLE.COM'

  # Google Workspace verification and MX Records for salatino.com.br
  SalatinoVerificationTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref SalatinoHostedZone
      Name: salatino.com.br.
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"google-site-verification=gPMo_548Wq2TzHAo2-L3e0jbi4dRg7nfD6yiNTE7bPA"'

  SalatinoGoogleVerificationCNAME:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref SalatinoHostedZone
      Name: odsveh5c56u4.salatino.com.br.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - gv-taz472b4vrxta3.dv.googlehosted.com

  SalatinoMXRecords:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref SalatinoHostedZone
      Name: salatino.com.br.
      Type: MX
      TTL: 300
      ResourceRecords:
        - '1 ASPMX.L.GOOGLE.COM'
        - '5 ALT1.ASPMX.L.GOOGLE.COM'
        - '5 ALT2.ASPMX.L.GOOGLE.COM'
        - '10 ALT3.ASPMX.L.GOOGLE.COM'
        - '10 ALT4.ASPMX.L.GOOGLE.COM'

  # Google verification for clubesalatino.com.br
  ClubeSalatinoGoogleVerificationRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref ClubeSalatinoHostedZone
      Type: TXT
      Name: clubesalatino.com.br.
      TTL: 300
      ResourceRecords:
        - '"google-site-verification=viuqMRPE_9Mk19MTtPQ6kxpk2GUg3tsFgHUL"'

Outputs:
  ConsultingRootDomain:
    Description: Sound Space Consulting Root Domain
    Value: soundspaceconsulting.com.au
    Export:
      Name: Domain-ConsultingRootDomain-Ref

  CounsellingRootDomain:
    Description: Sound Space Counselling Root Domain
    Value: soundspacecounselling.au
    Export:
      Name: Domain-CounsellingRootDomain-Ref

  ConsultingHostedZone:
    Description: Sound Space Consulting Hosted Zone
    Value: !Ref ConsultingHostedZone
    Export:
      Name: Domain-ConsultingHostedZone-Ref

  CounsellingHostedZone:
    Description: Sound Space Counselling Hosted Zone
    Value: !Ref CounsellingHostedZone
