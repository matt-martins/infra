  CanilSalatinoDomain:
    Description: Canil Salatino Root Domain
    Value: canilsalatino.com.br
    Export:
      Name: Domain-CanilSalatinoDomain-Ref

  SalatinoDomain:
    Description: Salatino Root Domain
    Value: salatino.com.br
    Export:
      Name: Domain-SalatinoDomain-Ref

  ClubeSalatinoHostedZone:
    Description: Clube Salatino Hosted Zone
    Value: !Ref ClubeSalatinoHostedZone
    Export:
      Name: Domain-ClubeSalatinoHostedZone-Ref

  CanilSalatinoHostedZone:
    Description: Canil Salatino Hosted Zone
    Value: !Ref CanilSalatinoHostedZone
    Export:
      Name: Domain-CanilSalatinoHostedZone-Ref

  SalatinoHostedZone:
    Description: Salatino Hosted Zone
    Value: !Ref SalatinoHostedZone
    Export:
      Name: Domain-SalatinoHostedZone-Ref

  CurvesSculptingDomain:
    Description: Curves Sculpting Root Domain
    Value: curvessculpting.com.au
    Export:
      Name: Domain-CurvesSculptingDomain-Ref

  CurvesSculptingHostedZone:
    Description: Curves Sculpting Hosted Zone
    Value: !Ref CurvesSculptingHostedZone
    Export:
      Name: Domain-CurvesSculptingHostedZone-Ref

  CassiaBoglioDomain:
    Description: Cassia Boglio Root Domain
    Value: cassiaboglio.com
    Export:
      Name: Domain-CassiaBoglioDomain-Ref

  CassiaBoglioHostedZone:
    Description: Cassia Boglio Hosted Zone
    Value: !Ref CassiaBoglioHostedZone
